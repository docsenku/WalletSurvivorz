<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SettleMints</title>
    <style>
        body {
            width: 380px;
            height: 600px;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(to bottom, #0f172a, #1e293b);
            color: white;
            overflow: hidden;
        }
        
        .container {
            height: 100vh;
            overflow-y: auto;
        }
        
        /* Custom scrollbar */
        .container::-webkit-scrollbar {
            width: 6px;
        }
        
        .container::-webkit-scrollbar-track {
            background: #1e293b;
        }
        
        .container::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        
        .container::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            gap: 16px;
        }
        
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #374151;
            border-top: 3px solid #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Button styles */
        .btn {
            background: #374151;
            border: 1px solid #4b5563;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: #4b5563;
        }
        
        .btn-primary {
            background: #10b981;
            border-color: #10b981;
        }
        
        .btn-primary:hover {
            background: #059669;
        }

        /* Card styles */
        .card {
            background: #1e293b;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        /* Progress bar */
        .progress {
            width: 100%;
            height: 8px;
            background: #374151;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: #10b981;
            transition: width 0.3s ease;
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            background: #374151;
            color: white;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 500;
        }
        
        .badge-success {
            background: #10b981;
        }
        
        .badge-danger {
            background: #ef4444;
        }

        /* Tab navigation */
        .tabs {
            display: flex;
            border-bottom: 1px solid #374151;
        }
        
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 12px;
            transition: color 0.2s;
        }
        
        .tab.active {
            color: #10b981;
            border-bottom: 2px solid #10b981;
        }
        
        .tab:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Loading SettleMints...</div>
        </div>
        <div id="game-container" style="display: none;"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
